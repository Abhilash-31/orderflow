apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
    {{- include "orderflow.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - containerPort: {{ .Values.kafka.port }}
            - containerPort: 9093
              name: controller
          env:
            # Single-node KRaft broker+controller — same config as
            # docker-compose.yml, just with the K8s Service DNS name
            # ("kafka") instead of the compose service name.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # Pins the heap comfortably under the container's memory limit
            # below (the launch script otherwise defaults to -Xmx1G -Xms1G),
            # leaving headroom for metaspace/direct buffers/page cache.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
          # An exec probe running `kafka-topics.sh` launches a brand-new JVM
          # on every single tick — first tried with a 1s timeout (too short
          # even to start a JVM: crash-looped in ~72s), then bumped to 15s,
          # which STILL timed out ("command timed out ... after 15s") after
          # the broker ran a genuinely healthy 170s. The real problem isn't
          # the timeout value: GitHub-hosted runners are 2 vCPUs, and this
          # single CPU budget is shared across the broker, 4 Java services
          # and Postgres in the kind cluster — spawning a fresh JVM every
          # probe tick just to check health is too heavy for that budget,
          # no matter how generous the timeout. A tcpSocket probe just
          # checks that Kafka's listener port is open — no JVM spawn, no
          # meaningful CPU cost — which is both cheaper and, once the
          # broker logs "Awaiting socket connections on 0.0.0.0:9092", an
          # accurate enough signal that it's up.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
    {{- include "orderflow.labels" . | nindent 4 }}
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: {{ .Values.kafka.port }}
      targetPort: {{ .Values.kafka.port }}
    - name: controller
      port: 9093
      targetPort: 9093
