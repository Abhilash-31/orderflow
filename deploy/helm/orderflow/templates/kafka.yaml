apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
    {{- include "orderflow.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - containerPort: {{ .Values.kafka.port }}
            - containerPort: 9093
              name: controller
          env:
            # Single-node KRaft broker+controller — same config as
            # docker-compose.yml, just with the K8s Service DNS name
            # ("kafka") instead of the compose service name.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # Pins the heap comfortably under the container's memory limit
            # below (the launch script otherwise defaults to -Xmx1G -Xms1G),
            # leaving headroom for metaspace/direct buffers/page cache.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
          # `kafka-topics.sh` launches a brand-new JVM on every single probe
          # invocation, which routinely takes several seconds — but exec
          # probes default to a 1s timeout. Without an explicit
          # timeoutSeconds here, every probe run was getting killed by its
          # own timeout before the JVM even finished starting, so the
          # broker never posted enough consecutive successes and kept
          # getting SIGTERM'd (exit 143) and restarted by the kubelet after
          # a few "failed liveness probe" events — a genuinely healthy
          # broker, crash-looped by a probe that was too impatient to ever
          # pass. Confirmed via `kubectl describe pod` showing
          # "Last State: Terminated, Reason: Error, Exit Code: 143" plus
          # repeated "command timed out ... after 1s" events.
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-topics.sh
                - --bootstrap-server
                - localhost:9092
                - --list
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-topics.sh
                - --bootstrap-server
                - localhost:9092
                - --list
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
    {{- include "orderflow.labels" . | nindent 4 }}
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: {{ .Values.kafka.port }}
      targetPort: {{ .Values.kafka.port }}
    - name: controller
      port: 9093
      targetPort: 9093
